<header class="site-header">
  <div class="container masthead">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="ROBIS Lab home">
      <img src="{{ '/assets/images/brand/robis-logo.png' | relative_url }}" width="1100" height="323" alt="ROBIS Lab — Robotics and Intelligent Systems Lab">
    </a>
    <div class="university-brand">
      <a href="https://mpusite.mpu.edu.mo/esca/en/index.php" aria-label="Macao Polytechnic University Faculty of Applied Sciences website">
        <img src="{{ '/assets/images/brand/mpu-fca-logo.png' | relative_url }}" width="742" height="99" alt="Macao Polytechnic University — Faculty of Applied Sciences">
      </a>
    </div>
  </div>
  <div class="navigation-bar">
    <div class="container navigation-inner">
      <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false">
        <span>Menu</span><span class="menu-lines" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}" {% if page.nav == item.title %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
