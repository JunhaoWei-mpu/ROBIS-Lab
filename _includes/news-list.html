<ol class="news-list">{% for item in site.data.news limit: include.limit %}<li>
<time datetime="{{ item.month }}">{{ item.month | replace: '-', '.' }}</time>
<div>
<p>{{ item.text }}</p>{% unless include.compact %}<a class="news-source" href="{{ item.source }}">Member update ↗</a>{% endunless %}</div>
</li>{% endfor %}</ol>
