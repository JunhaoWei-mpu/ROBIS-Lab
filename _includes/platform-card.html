<article class="platform-card">
<a class="platform-image" href="{{ include.platform.url | relative_url }}" aria-label="Explore {{ include.platform.name }}">
<img src="{{ '/assets/images/platforms/' | append: include.platform.image | append: '.webp' | relative_url }}" alt="{{ include.platform.alt }}" width="{{ include.platform.width }}" height="{{ include.platform.height }}" loading="lazy">
</a>
<div class="platform-copy">
<p class="eyebrow">{{ include.platform.category }}</p>
<h3>
<a href="{{ include.platform.url | relative_url }}">{{ include.platform.name }}</a>
</h3>
<p>{{ include.platform.summary }}</p>
<a class="text-link" href="{{ include.platform.url | relative_url }}">Explore platform →</a>
</div>
</article>
