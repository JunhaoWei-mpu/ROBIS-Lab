- id: computing
  title: Intelligent Computing and Optimization
  short: Optimization, learning, and knowledge
  question: Search, learning, and structured knowledge provide complementary tools for planning and decision-making.
  summary: We investigate metaheuristic optimization, reinforcement learning, multi-agent decision-making, knowledge
    representation, and multimodal learning, with links to navigation, engineering design, and intelligent transportation.
  focus:
  - Metaheuristic search and constrained optimization
  - Reinforcement learning and multi-agent decisions
  - Knowledge representation and multimodal learning
