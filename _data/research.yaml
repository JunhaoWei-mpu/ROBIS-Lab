- id: embodied
  title: Vision–Language–Action and Embodied Intelligence
  short: Language-guided robotic tasks
  question: Language-guided robotics requires converting semantic instructions into structured plans for robot execution.
  summary: We explore the connection between visual grounding, language-based task descriptions, planning, and robot
    execution. Aerial mission generation and robot demonstration data collection offer complementary research settings.
  focus:
  - Vision–language grounding and structured mission planning
  - Teleoperation and demonstration data collection
  - Imitation learning and VLA methods as ongoing research
