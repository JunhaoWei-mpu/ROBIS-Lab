- id: manipulation
  title: Robotic Manipulation and Mobile Robots
  short: Motion with interaction
  question: How can mobility and manipulation work together for physical interaction?
  summary: Our interests span robot arms, dual-arm coordination, mobile manipulation, and UAV–manipulator integration.
    Chironix provides a physical foundation for studying perception, planning, and demonstration data collection.
  focus:
  - Neural motion planning and scene representation
  - Dual-arm planning and mobile manipulation
  - UAV–manipulator system integration
  platforms:
