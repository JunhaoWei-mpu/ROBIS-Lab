- id: communications
  title: UAV Communications and Networked Systems
  short: UAV communications and networking
  question: Communication quality and motion planning are coupled challenges for connected UAV systems.
  summary: We study wireless communication and signal prediction for UAV systems, connecting communication conditions
    with intelligent planning. Our interests include low Earth orbit satellite and NR5G signal processing, machine
    learning for communication systems, and coordinated planning for UAV fleets.
  focus:
  - UAV wireless communications and signal prediction
  - Low Earth orbit satellite and NR5G signal processing
  - Machine learning for communication-aware decision-making
  - AI-driven path planning for multi-UAV systems
