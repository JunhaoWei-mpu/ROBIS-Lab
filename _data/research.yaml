- id: aerial
  title: Autonomous Aerial Robotics
  short: UAV navigation and mission planning
  question: Reliable UAV planning requires fast local decisions and coherent mission-level routes.
  summary: We study autonomous UAV navigation, perception, trajectory planning, and mission generation, connecting
    local motion decisions with larger-scale task planning.
  focus:
  - Depth-based perception and learned motion planning
  - Geometric safety and dynamically feasible trajectories
  - Language-guided aerial mission generation
